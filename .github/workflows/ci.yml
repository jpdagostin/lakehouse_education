name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (exigido pelo PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Instalar dependências
        run: uv sync --group dev

      - name: Cache dos JARs do Delta (Ivy)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy2-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Formatação (ruff format)
        run: uv run ruff format --check .

      - name: Testes com cobertura
        run: uv run pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload do relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
